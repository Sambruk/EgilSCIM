# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
        build_type: [Release]
        include:
          - os: windows-2022
            cmake_preset: windows
          - os: ubuntu-latest
            cmake_preset: unix

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      if: matrix.os == 'windows-2022'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: "Set environmental variables"
      shell: bash
      run: |
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV        

    - name: Install dependencies on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libldap2-dev

    - name: Show CMake version and generators
      run: |
        cmake --version
        cmake --help

    - name: Configure CMake
      run: cmake --preset=${{ matrix.cmake_preset }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Tests on Windows
      if: matrix.os == 'windows-2022'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: .\${{ matrix.build_type }}\tests.exe

    - name: Tests on Unix
      if: matrix.os == 'ubuntu-latest'
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ./tests

    - name: Setup Python for SBOM generation
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install vcpkg-sbom
      # vcpkg-sbom uses rich without declaring it as a dependency
      run: pip install vcpkg-sbom==0.0.6 rich==15.0.0

    - name: Generate SBOM
      # The aggregated SBOM is created from the SPDX files vcpkg generates for
      # each installed package, see .github/scripts/strip_spdx_files.py for why
      # they need to be preprocessed.
      shell: bash
      env:
        PYTHONUTF8: 1
      run: |
        triplet=$(sed -n 's/^VCPKG_TARGET_TRIPLET:[A-Z]*=//p' build/CMakeCache.txt | tr -d '\r')
        installed_dir=$(sed -n 's/^VCPKG_INSTALLED_DIR:[A-Z]*=//p' build/CMakeCache.txt | tr -d '\r')
        python .github/scripts/strip_spdx_files.py "$installed_dir/$triplet" "build/sbom-input/$triplet"

        # vcpkg-sbom writes its output to the current directory, put it next to the binary
        if [ "$RUNNER_OS" = "Windows" ]; then
          cd "build/${{ matrix.build_type }}"
        else
          cd build
        fi
        vcpkg-sbom "$GITHUB_WORKSPACE/build/sbom-input" \
          --triplet "$triplet" \
          --project EgilSCIMClient \
          --namespace "${{ github.server_url }}/${{ github.repository }}/sbom/EgilSCIMClient-$RUNNER_OS-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" \
          --organization "Föreningen Sambruk" \
          --email "info@sambruk.se"

    - name: Upload Windows artifacts
      if: matrix.os == 'windows-2022'
      uses: actions/upload-artifact@v4
      with:
        name: EgilSCIMClient-${{ matrix.os }}
        path: build/${{ matrix.build_type }}

    - name: Upload Ubuntu artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: EgilSCIMClient-${{ matrix.os }}
        path: |
          build/EgilSCIMClient
          build/EgilSCIMClient.spdx.json
